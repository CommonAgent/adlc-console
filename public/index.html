<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADLC Console</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>

<body>
<div class="app" id="app">
  <div class="top">
    <span><b>adlc console</b> · <span id="svc">…</span></span>
    <nav class="topnav" aria-label="The factory">
      <a id="products" href="#/products">Products</a>
      <a id="board" href="#/board">Board</a>

      <a id="analytics" href="#/analytics" hidden>Analytics</a>
      <a id="lifecycle" href="#/lifecycle">Lifecycle</a>
      <a id="people" href="#/people" hidden>People</a>

    <a class="askboss" id="askboss" href="#" hidden>Ask the boss</a>

  </div>
  <nav class="rail" id="rail" aria-label="Lifecycles and builds">
    <div id="spine" hidden></div>
    <div id="railhome">
    <div id="lifecycles"></div>
    <h2>Builds</h2>
    <div id="builds"></div>

    </div>

</div>
